# Local infrastructure for the notification service.
#   docker compose up -d
#   Kafka   -> localhost:9092
#   MailHog -> SMTP localhost:1025, inbox in the browser: http://localhost:8025   (catches every email, sends nothing real)
#
# NOTE: payment-service's docker-compose.yml starts the SAME Kafka (container "tickethub-kafka", port 9092).
#       Run only ONE of the two Kafka compose files. If that one is already running, start just MailHog:
#           docker compose up -d mailhog
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: tickethub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: tickethub-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox
