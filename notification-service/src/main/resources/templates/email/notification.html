<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${headline}">Notification</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="width:100%;max-width:600px;background-color:#ffffff;border-radius:8px;overflow:hidden;">
                <!-- Header -->
                <tr>
                    <td style="background-color:#0f172a;padding:18px 28px;color:#ffffff;font-size:20px;font-weight:bold;"
                        th:text="${brandName}">TicketHub</td>
                </tr>
                <!-- Headline bar (colour depends on the event) -->
                <tr>
                    <td th:style="'background-color:' + ${accent} + ';padding:16px 28px;color:#ffffff;font-size:18px;font-weight:bold;'"
                        th:text="${headline}">Headline</td>
                </tr>
                <!-- Body -->
                <tr>
                    <td style="padding:28px;font-size:15px;line-height:1.6;">
                        <p style="margin:0 0 16px 0;" th:text="${greeting}">Hello,</p>
                        <p style="margin:0 0 16px 0;" th:if="${intro != null and !#strings.isEmpty(intro)}" th:text="${intro}">Intro</p>
                        <p style="margin:0 0 16px 0;" th:each="p : ${paragraphs}" th:text="${p}">Paragraph</p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               th:if="${!#lists.isEmpty(rows)}"
                               style="margin:8px 0 20px 0;border:1px solid #e2e8f0;border-radius:6px;border-collapse:separate;">
                            <tr th:each="row : ${rows}">
                                <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;color:#64748b;width:38%;"
                                    th:text="${row.label}">Label</td>
                                <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;font-weight:bold;"
                                    th:text="${row.value}">Value</td>
                            </tr>
                        </table>

                        <p style="margin:0;color:#475569;font-size:14px;">
                            Need help? Write to
                            <a th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}" style="color:#2563eb;">support</a>.
                        </p>
                    </td>
                </tr>
                <!-- Footer -->
                <tr>
                    <td style="background-color:#f8fafc;padding:16px 28px;font-size:12px;color:#94a3b8;text-align:center;">
                        &copy; <span th:text="${year}">2026</span> <span th:text="${brandName}">TicketHub</span>.
                        This is an automated message, please do not reply.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
