# Used only when you start the app with:  --spring.profiles.active=mysql
# Values come from environment variables, with defaults after the colon.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tickethub_payment?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
